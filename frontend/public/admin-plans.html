<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plans · THE AURA FUNDING</title><link rel="stylesheet" href="/style.css"><style>
.plan-add{border:1px dashed #344254;border-radius:16px;padding:18px;margin-bottom:18px;background:#091018}.plan-add .row,.plan-card .row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}.plan-add label,.plan-card label{font-size:12px;color:var(--muted)}.plan-add input,.plan-add select,.plan-card input,.plan-card select{width:100%;box-sizing:border-box;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#07090d;color:var(--text)}.plans-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.plan-card{border:1px solid var(--line);border-radius:16px;padding:18px;background:#0b0f16}.plan-card h3{margin:0 0 5px}.plan-card .save{width:100%;margin-top:12px}@media(max-width:1000px){.plans-grid{grid-template-columns:1fr 1fr}.plan-add .row,.plan-card .row{grid-template-columns:1fr 1fr}}@media(max-width:650px){.plans-grid{grid-template-columns:1fr}.plan-add .row,.plan-card .row{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">THE AURA <span>FUNDING</span></div><nav class="nav"><a href="/admin">Dashboard</a><a href="/admin/accounts">Accounts</a><a class="active" href="/admin/plans">Plans</a></nav></aside><main class="main simple-dashboard"><header class="top"><div class="title"><h1>Plans</h1><div class="muted">Manage challenge plans, pricing and risk rules.</div></div><div class="top-actions"><div class="pill"><span class="online-dot"></span> System Online</div><button id="logoutBtn" class="btn">Logout</button></div></header><section class="section"><div class="plan-add"><h2 style="margin:0 0 8px">Add New Plan</h2><div class="row"><label>Challenge<select id="newType"><option>2 STEP</option><option>1 STEP</option><option>INSTANT</option></select></label><label>Variant<select id="newVariant"><option>LITE</option><option>PRO</option></select></label><label>Account Size<input id="newSize" type="number" placeholder="5000"></label><label>Price USD<input id="newPrice" type="number" step="0.01" placeholder="49"></label></div><div class="row"><label>Daily DD %<input id="newDD" type="number" step="0.1" value="4"></label><label>Max DD %<input id="newMaxDD" type="number" step="0.1" value="8"></label><label>Profit Target %<input id="newTarget" type="number" step="0.1" value="10"></label><label>Floating Loss %<input id="newFloat" type="number" step="0.1" value="4"></label><label>Min Trading Days<input id="newMinDays" type="number" min="0" step="1" value="5"></label></div><button id="addPlanBtn" class="btn primary" style="margin-top:12px">Add Plan</button> <span id="addMsg" class="muted"></span></div><div class="section-head"><div><h2>Challenge Plans</h2><div class="muted">Edit pricing, status and core risk limits.</div></div></div><div id="plans" class="plans-grid"><div class="muted">Loading plans…</div></div></section></main></div>
<script>
const $=id=>document.getElementById(id);
async function loadPlans(){const box=$("plans");try{const r=await fetch("/api/v1/admin/plans",{credentials:"same-origin",cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error||"Load failed");box.innerHTML=d.plans.map(p=>{const x=p.rules||{},dd=x.dailyDrawdown?.limit??"",md=x.maxDrawdown?.limit??"",pt=x.profitTarget?.target??"",fl=x.floatingLoss?.limit??"",min=x.minTradingDays?.limit??"";return '<article class="plan-card" data-id="'+p.id+'"><h3>'+p.name+'</h3><div class="muted">$'+Number(p.account_size).toLocaleString()+'</div><div class="row"><label>Price<input class="price" type="number" step="0.01" value="'+p.price+'"></label><label>Status<select class="active"><option value="true" '+(p.active?"selected":"")+'>Active</option><option value="false" '+(!p.active?"selected":"")+'>Hidden</option></select></label></div><div class="row"><label>Daily DD %<input class="dd" type="number" step="0.1" value="'+dd+'"></label><label>Max DD %<input class="md" type="number" step="0.1" value="'+md+'"></label><label>Profit Target %<input class="pt" type="number" step="0.1" value="'+pt+'"></label><label>Floating Loss %<input class="fl" type="number" step="0.1" value="'+fl+'"></label><label>Min Trading Days<input class="min" type="number" min="0" step="1" value='+min+'"></label></div><button class="btn primary save">Save Plan</button><div class="muted msg"></div></article>'}).join("");box.querySelectorAll(".save").forEach(b=>b.onclick=async()=>{const c=b.closest(".plan-card"),p=d.plans.find(x=>x.id===c.dataset.id),msg=c.querySelector(".msg"),rules=structuredClone(p.rules||{});rules.dailyDrawdown={...(rules.dailyDrawdown||{}),enabled:true,mode:"percent",limit:Number(c.querySelector(".dd").value),basis:"start_of_day_equity",action:"BREACH_ACCOUNT"};rules.maxDrawdown={...(rules.maxDrawdown||{}),enabled:true,mode:"percent",limit:Number(c.querySelector(".md").value),basis:"initial_balance",type:"static",action:"BREACH_ACCOUNT"};rules.floatingLoss={...(rules.floatingLoss||{}),enabled:true,mode:"percent",limit:Number(c.querySelector(".fl").value),action:"CLOSE_POSITIONS"};rules.profitTarget={...(rules.profitTarget||{}),enabled:true,mode:"percent",target:Number(c.querySelector(".pt").value),action:"PASS_ACCOUNT"};rules.minTradingDays={...(rules.minTradingDays||{}),enabled:Number(c.querySelector(".min").value)>0,limit:Number(c.querySelector(".min").value),action:"PASS_ACCOUNT"};msg.textContent="Saving…";const rr=await fetch("/api/v1/admin/plans/"+encodeURIComponent(p.id),{method:"PATCH",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:p.name,price:Number(c.querySelector(".price").value),currency:"USD",active:c.querySelector(".active").value==="true",rules})});msg.textContent=rr.ok?"Saved successfully.":"Save failed.";});}catch(e){box.innerHTML='<div class="muted">Unable to load plans.</div>'}}
$("addPlanBtn").onclick=async()=>{const msg=$("addMsg"),type=$("newType").value,variant=$("newVariant").value;if(type==="INSTANT"&&variant!=="PRO"){msg.textContent="Instant only supports Pro.";return}msg.textContent="Adding…";const body={name:type+" "+variant,account_size:Number($("newSize").value),price:Number($("newPrice").value),currency:"USD",active:true,rules:{dailyDrawdown:{enabled:true,mode:"percent",limit:Number($("newDD").value),basis:"start_of_day_equity",action:"BREACH_ACCOUNT"},maxDrawdown:{enabled:true,mode:"percent",limit:Number($("newMaxDD").value),basis:"initial_balance",type:"static",action:"BREACH_ACCOUNT"},floatingLoss:{enabled:true,mode:"percent",limit:Number($("newFloat").value),action:"CLOSE_POSITIONS"},minTradingDays:{enabled:Number($("newMinDays").value)>0,limit:Number($("newMinDays").value),action:"PASS_ACCOUNT"},profitTarget:{enabled:true,mode:"percent",target:Number($("newTarget").value),action:"PASS_ACCOUNT"}}};const r=await fetch("/api/v1/admin/plans",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});msg.textContent=r.ok?"Plan added successfully.":"Add failed.";if(r.ok)loadPlans()};$("logoutBtn").onclick=async()=>{await fetch("/api/v1/auth/logout",{method:"POST"});location.href="/login"};loadPlans();
</script></body></html>
