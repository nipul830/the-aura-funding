<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout · THE AURA FUNDING</title><link rel="stylesheet" href="/style.css"><style>.checkout{max-width:720px}.pay-methods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.method{padding:14px;border:1px solid var(--line);border-radius:12px;background:#0b1018;color:var(--text);font-weight:700}.method.active{border-color:#f5b72c;box-shadow:0 0 18px #f5b72c22}.pay-box{border:1px solid var(--line);border-radius:16px;padding:18px;background:#0b1018;margin-top:14px}.pay-box img{max-width:220px;width:100%;border-radius:12px;background:#fff;padding:8px}.pay-box input,.pay-box select{width:100%;box-sizing:border-box;padding:13px;margin-top:7px;border:1px solid var(--line);border-radius:10px;background:#07090d;color:var(--text)}.timer{font-size:30px;font-weight:800;color:#f5b72c}.success{color:#27d17f}.danger{color:#ff5d6c}@media(max-width:600px){.pay-methods{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand">THE AURA <span>FUNDING</span></div><nav class="nav"><a href="/">Home</a><a href="/user">Dashboard</a><a class="active" href="/user/plans">Plans</a><a href="/user/terminal">Terminal</a><a href="/user/settings">Settings</a></nav></aside><main class="main"><div class="top"><div class="title"><h1>Checkout</h1><div class="muted">Complete payment for your selected challenge.</div></div></div><div class="checkout" id="app"><div class="card"><div class="muted">Loading selected plan…</div></div></div></main></div><script>
const app=document.getElementById("app"),planId=new URLSearchParams(location.search).get("plan");let plan=null,settings=null,method="UPI";const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));const networks=["TRC20","ERC20","BEP20","POLYGON","SOLANA","ARBITRUM","OPTIMISM","AVALANCHE","BASE","TON"];
async function load(){if(!planId){app.innerHTML='<div class="card danger">No plan selected. <a href="/user/plans">Choose a plan</a></div>';return}const [pr,sr]=await Promise.all([fetch("/api/v1/plans"),fetch("/api/v1/payment/settings")]);const pd=await pr.json(),sd=await sr.json();plan=pd.plans?.find(x=>x.id===planId);settings=sd.settings||{};if(!plan){app.innerHTML='<div class="card danger">Plan not found.</div>';return}render()}
function render(){app.innerHTML='<div class="card"><div class="muted">Selected Challenge</div><h2>'+esc(plan.name)+'</h2><div class="metric gold">$'+Number(plan.account_size).toLocaleString()+'</div><div class="muted">Challenge fee</div><div class="metric">$'+Number(plan.price).toFixed(2)+' '+esc(plan.currency)+'</div></div><div class="pay-methods"><button class="method active" data-m="UPI">UPI</button><button class="method" data-m="USDT">USDT</button></div><div id="paymentBox" class="pay-box"></div>';document.querySelectorAll(".method").forEach(b=>b.onclick=()=>{method=b.dataset.m;document.querySelectorAll(".method").forEach(x=>x.classList.toggle("active",x===b));drawBox()});drawBox()}
function drawBox(){const box=document.getElementById("paymentBox");if(method==="UPI"){box.innerHTML='<h3>Pay via UPI</h3><p class="muted">UPI ID</p><div class="metric">'+esc(settings.upi_id||"Not configured")+'</div>'+(settings.upi_qr_url?'<img src="'+esc(settings.upi_qr_url)+'" alt="UPI QR">':"")+'<label>UTR / Transaction ID<input id="tx" placeholder="Enter UTR"></label><button id="submit" class="btn primary" style="margin-top:14px;width:100%">Submit Payment</button>'}else{box.innerHTML='<h3>Pay via USDT</h3><label>Network<select id="network">'+networks.map(n=>'<option>'+n+'</option>').join("")+'</select></label><div id="address" class="metric" style="margin-top:12px;word-break:break-all">'+esc(settings.usdt_addresses?.TRC20||"Not configured")+'</div><label>Transaction Hash / ID<input id="tx" placeholder="Enter transaction hash"></label><button id="submit" class="btn primary" style="margin-top:14px;width:100%">Submit Payment</button>';document.getElementById("network").onchange=e=>document.getElementById("address").textContent=settings.usdt_addresses?.[e.target.value]||"Not configured"}document.getElementById("submit").onclick=submit}
async function submit(){const tx=document.getElementById("tx").value.trim(),network=method==="USDT"?document.getElementById("network").value:null;if(!tx){alert("Enter transaction ID / UTR");return}const b=document.getElementById("submit");b.disabled=true;b.textContent="Submitting…";const r=await fetch("/api/v1/payments",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({plan_id:plan.id,method,network,transaction_id:tx})});const d=await r.json();if(!r.ok){b.disabled=false;b.textContent="Submit Payment";alert(d.error||"Payment submission failed");return}showPending(d.payment)}
function showPending(p){const email=settings.support_email||"joker007llp@gmail.com";app.innerHTML='<div class="card"><div class="success">Payment submitted successfully.</div><h2>Waiting for Admin Approval</h2><p class="muted">Your payment is under review.</p><div id="timer" class="timer">15:00</div><p class="muted">If approval is not received within 15 minutes, contact <a href="mailto:'+email+'">'+email+'</a>.</p><button class="btn" onclick="location.href=\'/user\'">Go to Dashboard</button></div>';let end=new Date(p.expires_at).getTime();const iv=setInterval(()=>{const left=Math.max(0,end-Date.now()),sec=Math.floor(left/1000);document.getElementById("timer").textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");if(left<=0)clearInterval(iv)},1000)}
load();</script></body></html>
