<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login · THE AURA FUNDING</title><link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
<main class="login-shell">
  <div class="login-card">
    <div class="login-brand">THE AURA <span>FUNDING</span></div>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to your secure trading platform.</p>
    <form id="loginForm">
      <label class="field">Email<input id="email" type="email" autocomplete="username" required placeholder="you@example.com"></label>
      <label class="field">Password<input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label>
      <button class="btn primary login-btn" type="submit">Sign In</button>
      <div id="error" class="login-error"></div>
    </form>
  </div>
</main>
<script>
const form=document.getElementById("loginForm"), error=document.getElementById("error");
form.addEventListener("submit",async(e)=>{
 e.preventDefault(); error.textContent="";
 const button=form.querySelector("button"); button.disabled=true; button.textContent="Signing in…";
 try{
  const r=await fetch("/api/v1/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});
  const data=await r.json();
  if(!r.ok) throw new Error(data.error||"Login failed");
  location.href=data.user.role==="admin"?"/admin":"/user";
 }catch(err){error.textContent=err.message;button.disabled=false;button.textContent="Sign In";}
});
</script>
</body>
</html>
