<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account · THE AURA FUNDING</title><link rel="stylesheet" href="/style.css"></head><body class="login-page"><main class="login-shell"><div class="login-card"><div class="login-brand">THE AURA <span>FUNDING</span></div><h1>Create account</h1><p class="muted">Create your trading platform account.</p><form id="signupForm"><label class="field">Full Name<input id="name" type="text" autocomplete="name" required placeholder="Your name"></label><label class="field">Email<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label class="field">Password<input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Minimum 8 characters"></label><label class="field">Confirm Password<input id="confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="Repeat password"></label><button class="btn primary login-btn" type="submit">Create Account</button><div id="error" class="login-error"></div></form><div class="auth-divider"><span>Already have an account?</span></div><a class="btn create-account-btn" href="/login">Back to Login</a></div></main><script>document.getElementById("signupForm").addEventListener("submit",e=>{e.preventDefault();const error=document.getElementById("error");if(password.value!==confirm.value){error.textContent="Passwords do not match";return}error.textContent="Account registration will be connected to the backend next.";});</script></body></html>
