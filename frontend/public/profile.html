<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile · THE AURA FUNDING</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="app"><aside class="side"><div class="brand">THE AURA <span>FUNDING</span></div><nav class="bottom-nav"><a class="" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9Z"/></svg><span>Home</span></a><a class="" href="/user"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/></svg><span>Dashboard</span></a><a class="" href="/user/plans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 2 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1 3-6Z"/></svg><span>Plans</span></a><a class="" href="/user/terminal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10m5 10V4m5 16v-7m5 7V7"/></svg><span>Terminal</span></a><a class="active" href="/user/settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm8 4a8 8 0 0 0-.1-1.2l2-1.5-2-3.4-2.4 1a8 8 0 0 0-2.1-1.2L15 3h-4l-.4 2.7a8 8 0 0 0-2.1 1.2l-2.4-1-2 3.4 2 1.5A8 8 0 0 0 6 12c0 .4 0 .8.1 1.2l-2 1.5 2.4-1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2Z"/></svg><span>Settings</span></a></nav></aside>
<main class="main"><div class="top"><div class="title"><h1>Profile</h1><div class="muted">Manage your account details.</div></div><a class="btn" href="/user">Dashboard</a></div>
<section class="profile-card"><div class="profile-head"><div class="profile-avatar" id="avatar">A</div><div><h2 id="profileName">Your Profile</h2><div class="muted" id="profileEmail"></div></div></div>
<form id="profileForm" class="profile-form"><label class="field">Full Name<input id="fullName" required></label><label class="field">Username<input id="username" placeholder="Choose a username"></label><label class="field">Phone Number<input id="phone" type="tel" placeholder="+91XXXXXXXXXX"></label><div class="profile-email muted">Email: <span id="emailText"></span><small>Email cannot be changed here.</small></div><button class="btn primary" type="submit">Save Profile</button><div id="profileMessage" class="login-success"></div></form></section>
<section class="profile-card certificate-card"><div><h2>Generate NFT Certificate</h2><p class="muted">Certificate generation will be available soon.</p></div><button class="btn" id="certificateBtn" type="button">Generate NFT Certificate</button><div id="certificateMessage" class="login-success"></div></section>
<section class="profile-card logout-card"><h2>Account</h2><p class="muted">Sign out from this device.</p><button class="btn danger-btn" id="logoutBtn" type="button">Logout</button></section>
</main></div>
<script>
const form=document.getElementById("profileForm"),msg=document.getElementById("profileMessage");
function renderProfile(u){if(!u)return;fullName.value=u.fullName||u.full_name||"";username.value=u.username||"";phone.value=u.phone||"";profileName.textContent=u.fullName||u.full_name||"Your Profile";profileEmail.textContent=u.email||"";emailText.textContent=u.email||"";avatar.textContent=(u.fullName||u.full_name||u.email||"A").charAt(0).toUpperCase();}
async function loadProfile(){
  try{
    const cached=JSON.parse(localStorage.getItem("aura_user")||"null");
    if(cached) renderProfile(cached);
  }catch{}
  try{
    const r=await fetch("/api/v1/auth/profile",{credentials:"same-origin",cache:"no-store"});
    const d=await r.json();
    if(r.ok&&d.user){renderProfile(d.user);try{localStorage.setItem("aura_user",JSON.stringify(d.user))}catch{};return;}
    const me=await fetch("/api/v1/auth/me",{credentials:"same-origin",cache:"no-store"});
    if(me.ok){const md=await me.json();if(md.user){renderProfile(md.user);try{localStorage.setItem("aura_user",JSON.stringify(md.user))}catch{};return;}}
    if(!localStorage.getItem("aura_user")) location.href="/login";
  }catch{
    if(!localStorage.getItem("aura_user")) location.href="/login";
  }
}
form.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="Saving…";const r=await fetch("/api/v1/auth/profile",{method:"PATCH",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({fullName:fullName.value,username:username.value,phone:phone.value})});const d=await r.json();msg.textContent=r.ok?"Profile saved successfully.":(d.error||"Unable to save profile.");if(r.ok){try{localStorage.setItem("aura_user",JSON.stringify(d.user))}catch{};loadProfile()}});
certificateBtn.addEventListener("click",()=>certificateMessage.textContent="NFT Certificate generation is coming soon.");
logoutBtn.addEventListener("click",async()=>{await fetch("/api/v1/auth/logout",{method:"POST",credentials:"same-origin"});try{localStorage.removeItem("aura_user")}catch{};location.href="/";});loadProfile();
</script></body></html>
