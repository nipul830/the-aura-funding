<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terminal · THE AURA FUNDING</title>
<link rel="stylesheet" href="/style.css">
<style>
:root{--gold:#d9ad55;--bg:#08090b;--panel:#101216;--line:#252831;--muted:#8d929d}
body{background:var(--bg);color:#f5f6f8}.terminal-shell{min-height:100vh;display:flex;flex-direction:column}.terminal-top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 14px;background:#0b0c0f}.terminal-brand{font-weight:800;letter-spacing:.08em}.terminal-brand span{color:var(--gold)}.account-box{margin-left:auto;position:relative}.account-btn{background:#111319;border:1px solid #6b5427;color:#f1c66d;border-radius:8px;padding:9px 12px;min-width:180px;text-align:left}.account-list{display:none;position:absolute;right:0;top:44px;background:#101216;border:1px solid #3b3426;border-radius:10px;min-width:240px;z-index:30;overflow:hidden}.account-list.open{display:block}.account-item{padding:11px 13px;border-bottom:1px solid #22252c;cursor:pointer}.account-item:hover,.account-item.selected{background:#211b10;color:#f1c66d}.terminal-main{display:grid;grid-template-columns:1fr 300px;gap:10px;padding:10px;flex:1}.chart-panel,.order-panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}.chart-head{height:52px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line)}select,input{background:#0b0d11;color:#f5f6f8;border:1px solid #30343d;border-radius:7px;padding:9px}.chart-wrap{height:calc(100vh - 140px);min-height:420px}.chart-status{margin-left:auto;font-size:12px;color:var(--muted)}.order-panel{padding:14px}.order-panel h3{margin:0 0 14px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.lot-row{display:flex;gap:6px}.lot-row button{flex:1;background:#181b21;color:#ddd;border:1px solid #30343d;border-radius:6px}.trade-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.trade-btns button{padding:13px;border:0;border-radius:8px;font-weight:800}.buy{background:#16855a;color:#fff}.sell{background:#b84045;color:#fff}.note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:16px}.trade-nav{display:none}.unsupported{color:#e4b45c;font-size:12px}.loading{color:var(--muted);padding:15px}@media(max-width:800px){.terminal-main{grid-template-columns:1fr}.order-panel{order:2}.chart-wrap{height:55vh;min-height:360px}.trade-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:60px;background:#0c0e12;border-top:1px solid var(--line);z-index:50}.trade-nav a{flex:1;text-align:center;padding:12px 4px;color:#8d929d;text-decoration:none;font-size:12px}.trade-nav a.active{color:var(--gold)}.terminal-main{padding-bottom:70px}.terminal-brand{font-size:12px}.account-btn{min-width:145px}}
</style></head>
<body>
<div class="terminal-shell">
<header class="terminal-top"><div class="terminal-brand">THE AURA <span>FUNDING</span></div><div id="dataStatus" class="chart-status">Connecting market data…</div>
<div class="account-box"><button id="accountBtn" class="account-btn">ACCOUNT SWITCH ▾</button><div id="accountList" class="account-list"></div></div></header>
<main class="terminal-main">
<section class="chart-panel"><div class="chart-head"><select id="symbol"><option value="XAUUSDT">GOLD</option><option value="BTCUSDT">BTC</option><option value="ETHUSDT">ETH</option><option value="EURUSDT">EUR</option><option value="USDJPY">USDJPY</option><option value="GBPUSDT">GBPUSD</option><option value="SOLUSDT">SOLUSDT</option></select><select id="interval"><option value="1m">1m</option><option value="5m" selected>5m</option><option value="15m">15m</option><option value="1h">1h</option><option value="4h">4h</option><option value="1d">1D</option></select><select id="candleLimit"><option value="5000">5K</option><option value="10000">10K</option><option value="25000">25K</option><option value="50000" selected>50K</option></select><div id="chartMsg" class="chart-status"></div></div><div id="chart" class="chart-wrap"></div></section>
<aside class="order-panel"><h3>Order</h3><div class="field"><label>ACCOUNT</label><div id="selectedAccount">Loading…</div></div><div class="field"><label>LOT SIZE</label><div class="lot-row"><button data-lot="-0.01">−</button><input id="lot" value="0.10" inputmode="decimal"><button data-lot="0.01">+</button></div></div><div class="trade-btns"><button class="sell" id="sell">SELL</button><button class="buy" id="buy">BUY</button></div><div class="note">Market data is live. Orders are UI-only until the server-side trading/risk execution API is connected. 50,000 candles is the terminal maximum.</div></aside>
</main>
<nav class="trade-nav"><a href="/user">Dashboard</a><a class="active" href="/user/terminal">Terminal</a><a href="/user/position">Position</a></nav>
</div>
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<script>
const chartEl=document.getElementById('chart');
const chart=LightweightCharts.createChart(chartEl,{layout:{background:{color:'#101216'},textColor:'#c7cbd3'},grid:{vertLines:{color:'#171a20'},horzLines:{color:'#171a20'}},rightPriceScale:{borderColor:'#292d35'},timeScale:{borderColor:'#292d35',timeVisible:true,secondsVisible:false}});
const candles=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#20a66b',downColor:'#d95359',borderUpColor:'#20a66b',borderDownColor:'#d95359',wickUpColor:'#20a66b',wickDownColor:'#d95359'});
let selected=null,accounts=[],timer=null;
const binanceSymbol={XAUUSDT:'PAXGUSDT',BTCUSDT:'BTCUSDT',ETHUSDT:'ETHUSDT',SOLUSDT:'SOLUSDT'};
const supported=s=>!!binanceSymbol[s];
async function loadAccounts(){try{const r=await fetch('/api/v1/accounts/mine',{credentials:'include'});if(!r.ok)throw 0;accounts=await r.json();if(!Array.isArray(accounts))accounts=accounts.accounts||[];selected=accounts.find(a=>a.id===localStorage.getItem('aura_selected_account'))||accounts.find(a=>a.status!=='breached')||accounts[0];renderAccounts()}catch(e){document.getElementById('selectedAccount').textContent='No account loaded';}}
function renderAccounts(){const list=document.getElementById('accountList');list.innerHTML=accounts.map(a=>'<div class="account-item '+(selected&&a.id===selected.id?'selected':'')+'" data-id="'+a.id+'">'+(a.account_id||a.id)+' · '+(a.status||'active').toUpperCase()+'</div>').join('');document.getElementById('selectedAccount').textContent=selected?(selected.account_id||selected.id):'No funded account';list.querySelectorAll('.account-item').forEach(x=>x.onclick=()=>{selected=accounts.find(a=>String(a.id)===x.dataset.id);if(selected)localStorage.setItem('aura_selected_account',selected.id);renderAccounts();document.getElementById('accountList').classList.remove('open')})}
document.getElementById('accountBtn').onclick=()=>document.getElementById('accountList').classList.toggle('open');
async function fetchCandles(){const uiSymbol=document.getElementById('symbol').value, interval=document.getElementById('interval').value, limit=Math.min(50000,Number(document.getElementById('candleLimit').value));const msg=document.getElementById('chartMsg');if(!supported(uiSymbol)){msg.innerHTML='<span class="unsupported">Live feed for this FX symbol needs the configured FX provider.</span>';candles.setData([]);document.getElementById('dataStatus').textContent='Provider required';return}
const sym=binanceSymbol[uiSymbol];let all=[],end=undefined;try{while(all.length<limit){const n=Math.min(1000,limit-all.length);let url='https://api.binance.com/api/v3/klines?symbol='+sym+'&interval='+interval+'&limit='+n;if(end)url+='&endTime='+end;const data=await fetch(url).then(r=>r.json());if(!Array.isArray(data)||!data.length)break;const batch=data.map(k=>({time:Math.floor(k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4]}));all=batch.concat(all);end=data[0][0]-1;if(data.length<n)break;if(data[0][0]===data[data.length-1][0])break}
const seen=new Set();all=all.filter(x=>!seen.has(x.time)&&seen.add(x.time)).slice(-limit);candles.setData(all);chart.timeScale().fitContent();document.getElementById('dataStatus').textContent='LIVE · '+all.length.toLocaleString()+' candles';msg.textContent='Max 50K';if(timer)clearInterval(timer);timer=setInterval(updateLive,5000)}catch(e){document.getElementById('dataStatus').textContent='Market data error';msg.textContent='Unable to load live data';}}
async function updateLive(){if(!supported(document.getElementById('symbol').value))return;try{const s=binanceSymbol[document.getElementById('symbol').value],i=document.getElementById('interval').value,d=await fetch('https://api.binance.com/api/v3/klines?symbol='+s+'&interval='+i+'&limit=1').then(r=>r.json());if(d&&d[0])candles.update({time:Math.floor(d[0][0]/1000),open:+d[0][1],high:+d[0][2],low:+d[0][3],close:+d[0][4]})}catch{}}
document.getElementById('symbol').onchange=fetchCandles;document.getElementById('interval').onchange=fetchCandles;document.getElementById('candleLimit').onchange=fetchCandles;
document.querySelectorAll('[data-lot]').forEach(b=>b.onclick=()=>{let v=Math.max(.01,Math.min(100,(+document.getElementById('lot').value||.1)+(+b.dataset.lot)));document.getElementById('lot').value=v.toFixed(2)});
document.getElementById('buy').onclick=()=>alert('BUY selected — server-side order execution will be connected next.');document.getElementById('sell').onclick=()=>alert('SELL selected — server-side order execution will be connected next.');
new ResizeObserver(()=>chart.applyOptions({width:chartEl.clientWidth,height:chartEl.clientHeight})).observe(chartEl);
loadAccounts();fetchCandles();
</script></body></html>
