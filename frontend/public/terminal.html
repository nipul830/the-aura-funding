<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Trading Terminal · AURA FUNDED</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#243443}body{overflow:hidden}.terminal-shell{height:100dvh;width:100%;display:grid;grid-template-rows:25% 75%;background:#fff;overflow:hidden;position:relative}.operator-system{grid-row:1;min-height:0;overflow:hidden}.top{padding:12px 20px 8px;border-bottom:1px solid #edf0f2;background:#fff;flex:0 0 auto}.account-row{display:flex;align-items:center;gap:10px;color:#71808d;font-size:13px;letter-spacing:.04em}.account-row .badge{background:#edf2f5;border-radius:14px;padding:4px 10px;color:#647381;font-size:12px;font-weight:600}.logout{margin-left:auto;color:#7b8791;text-decoration:none;font-size:14px}.money-row{display:flex;gap:24px;margin-top:2px;font-size:17px;font-weight:700;color:#1e2c38}.money-row span{font-weight:700}.trade-top{display:grid;grid-template-columns:1fr 1fr 118px;gap:8px;padding:6px 20px 5px;background:#fff}.quote{border:0;border-radius:14px;height:58px;color:#fff;text-align:center;display:flex;flex-direction:column;justify-content:center;font-size:14px;line-height:1.05}.quote small{font-size:13px;margin-bottom:2px}.quote strong{font-size:20px;font-weight:500}.sell{background:#f8074f}.buy{background:#0bc07e}.symbol{height:58px;border:1px solid #e1e6ea;border-radius:14px;background:#f7f9fa;padding:0 10px;font-size:14px;color:#263541;outline:none}.order-row{display:grid;grid-template-columns:175px 1fr;gap:8px;padding:0 20px 5px}.lot{height:44px;border:1px solid #dfe5e9;border-radius:13px;background:#f8fafb;padding:0 10px;font-size:15px;color:#344451}.limit{height:44px;border:0;border-radius:11px;background:#132e3e;color:#fff;font-size:15px;font-weight:700}.market-line{padding:0 20px 10px;color:#149a78;font-weight:700;font-size:14px}.tf-row{height:42px;border-bottom:1px solid #e8ecef;display:flex;align-items:center;gap:14px;padding:0 20px;overflow-x:auto;white-space:nowrap}.tf{border:0;background:transparent;color:#4d5c68;font-size:13px;padding:6px 8px;border-radius:10px}.tf.active{background:#edf2f5;font-weight:700}.live{margin-left:auto;color:#10a77b;font-weight:700}.chart-wrap{grid-row:2;position:relative;min-height:0;height:100%;overflow:hidden}.chart{position:absolute;inset:0}.position-overlay{display:none;position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}.bottom-nav{position:absolute;left:0;right:0;bottom:0;height:72px;display:flex;align-items:center;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #e5e9ec;background:#fff;z-index:20}.nav-item{flex:1;text-align:center;text-decoration:none;color:#71818d;font-size:15px;padding-top:7px}.nav-icon{height:27px;font-size:27px;line-height:25px;margin-bottom:4px}.nav-item.active{color:#597486}@media(max-width:600px){.operator-system{grid-row:1}.chart-wrap{grid-row:2}.top{padding:10px 20px 6px}.money-row{gap:20px;font-size:16px}.trade-top{grid-template-columns:1fr 1fr 138px;gap:12px;padding:8px 20px 7px}.quote{height:78px;border-radius:20px}.quote strong{font-size:27px}.symbol{height:78px}.order-row{grid-template-columns:195px 1fr;padding:0 20px 7px}.tf-row{gap:22px;padding:0 20px}.live{margin-left:0}.bottom-nav{height:74px}.nav-icon{font-size:25px}}@media(max-width:430px){.trade-top{grid-template-columns:1fr 1fr 118px;gap:10px;padding-left:20px;padding-right:20px}.quote strong{font-size:24px}.symbol{padding:0 12px}.order-row{grid-template-columns:195px 1fr;gap:12px}.tf-row{gap:16px}.money-row{gap:18px}}
</style></head>
<body>
<div class="terminal-shell">
<div class="operator-system">
<header class="top">
  <div class="account-row"><span>TRADING ACCOUNT</span><span class="badge">TRADING</span><span class="logout" id="logout">Logout</span></div>
  <div class="money-row"><div>Balance <span id="balance">$0.00</span></div><div>Equity <span id="equity">$0.00</span></div><span class="live-badge" style="margin-left:0;border:1px solid #39b99a;color:#169a7b;border-radius:20px;padding:7px 13px;font-size:14px">LIVE</span></div>
</header>
<section class="trade-top">
  <div class="quote sell"><small>SELL</small><strong id="sellPrice">—</strong></div>
  <div class="quote buy"><small>BUY</small><strong id="buyPrice">—</strong></div>
  <select id="symbol" class="symbol"><option value="BTCUSDT">BTC/USD</option><option value="XAUUSDT">GOLD/USD</option><option value="ETHUSDT">ETH/USD</option><option value="EURUSDT">EUR/USD</option><option value="USDJPY">USD/JPY</option><option value="GBPUSDT">GBP/USD</option><option value="SOLUSDT">SOL/USD</option></select>
</section>
<section class="order-row">
  <select id="lot" class="lot"></select>
  <button id="limit" class="limit">Buy Limit ✓</button>
</section>
<div class="market-line">Live market • <span id="marketPrice">—</span> • spread <span id="spread">—</span></div>
<div class="tf-row"><button class="tf" data-tf="1m">1m</button><button class="tf" data-tf="5m">5m</button><button class="tf active" data-tf="15m">15m</button><button class="tf" data-tf="30m">30m</button><button class="tf" data-tf="1h">1h</button><button class="tf" data-tf="4h">4h</button><span class="live">• LIVE</span></div>
</div>
<main class="chart-wrap"><div id="chart" class="chart"></div></main>
<nav class="bottom-nav">
  <a class="nav-item" href="/user"><div class="nav-icon">⌂</div><div>Home</div></a>
  <a class="nav-item active" href="/user/terminal"><div class="nav-icon">▱</div><div>Charts</div></a>
  <a class="nav-item" href="/user/position"><div class="nav-icon">ϟ</div><div>Position</div></a>
</nav>
</div>
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<script>
const symbol=document.getElementById('symbol'),chartEl=document.getElementById('chart');
const chart=LightweightCharts.createChart(chartEl,{layout:{background:{color:'#fff'},textColor:'#64727e'},grid:{vertLines:{color:'#edf0f2'},horzLines:{color:'#edf0f2'}},rightPriceScale:{borderColor:'#e4e8eb'},timeScale:{borderColor:'#e4e8eb',timeVisible:true,secondsVisible:false}});
const candles=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#06b77a',downColor:'#f20b57',borderUpColor:'#06b77a',borderDownColor:'#f20b57',wickUpColor:'#06b77a',wickDownColor:'#f20b57'});
const map={BTCUSDT:'BTCUSD',XAUUSDT:'XAUUSD',ETHUSDT:'ETHUSD',EURUSDT:'EURUSD',USDJPY:'USDJPY',GBPUSDT:'GBPUSD',SOLUSDT:'SOLUSD'};
let interval='15m',timer=null;
for(let i=1;i<=1000;i++){const o=document.createElement('option');o.value=(i/100).toFixed(2);o.textContent=(i/100).toFixed(2);if(i===10)o.selected=true;document.getElementById('lot').appendChild(o)}
async function market(symbolKey,tf){const s=map[symbolKey];const r=await fetch('https://biquote.io/api/'+s+'/ohlc?interval='+tf+'&limit=1000');if(!r.ok)throw new Error('Market unavailable');const d=await r.json();return (d.bars||[]).map(c=>({time:Math.floor(Date.parse(c.openTime)/1000),open:+c.open,high:+c.high,low:+c.low,close:+c.close})).filter(c=>Number.isFinite(c.time)).sort((a,b)=>a.time-b.time)}
async function loadChart(){try{const data=await market(symbol.value,interval);candles.setData(data);chart.timeScale().fitContent();const last=data[data.length-1];if(last){const p=last.close;document.getElementById('marketPrice').textContent=p.toFixed(2);document.getElementById('sellPrice').textContent=p.toFixed(2);document.getElementById('buyPrice').textContent=p.toFixed(2);document.getElementById('spread').textContent='—'}if(timer)clearInterval(timer);timer=setInterval(updateLive,5000)}catch(e){}}
async function updateLive(){try{const s=map[symbol.value];const r=await fetch('https://biquote.io/api/'+s+'/ohlc?interval='+interval+'&limit=2');const d=await r.json(),c=(d.bars||[])[0];if(c){const x={time:Math.floor(Date.parse(c.openTime)/1000),open:+c.open,high:+c.high,low:+c.low,close:+c.close};candles.update(x);document.getElementById('marketPrice').textContent=x.close.toFixed(2);document.getElementById('sellPrice').textContent=x.close.toFixed(2);document.getElementById('buyPrice').textContent=x.close.toFixed(2)}}catch{}}
async function loadAccount(){try{const r=await fetch('/api/v1/accounts/mine',{credentials:'include'});const d=await r.json();const a=(d.accounts||[])[0];if(a){document.getElementById('balance').textContent='$'+Number(a.balance||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});document.getElementById('equity').textContent='$'+Number(a.equity||a.balance||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}}catch{}}
document.querySelectorAll('.tf').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tf').forEach(x=>x.classList.remove('active'));b.classList.add('active');interval=b.dataset.tf;loadChart()});
symbol.onchange=loadChart;
document.getElementById('limit').onclick=()=>alert('Buy Limit order UI ready. Server-side execution will be connected with the trading engine.');
document.getElementById('logout').onclick=async()=>{try{await fetch('/api/v1/auth/logout',{method:'POST',credentials:'include'})}finally{location.href='/login'}};
new ResizeObserver(()=>chart.applyOptions({width:chartEl.clientWidth,height:chartEl.clientHeight})).observe(chartEl);
loadAccount();loadChart();
</script></body></html>
