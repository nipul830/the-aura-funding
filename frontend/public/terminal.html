<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<script>
const chartEl=document.getElementById('chart');
const chart=LightweightCharts.createChart(chartEl,{layout:{background:{color:'#101216'},textColor:'#c7cbd3'},grid:{vertLines:{color:'#171a20'},horzLines:{color:'#171a20'}},rightPriceScale:{borderColor:'#292d35'},timeScale:{borderColor:'#292d35',timeVisible:true,secondsVisible:false}});
const candles=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#20a66b',downColor:'#d95359',borderUpColor:'#20a66b',borderDownColor:'#d95359',wickUpColor:'#20a66b',wickDownColor:'#d95359'});
let selected=null,accounts=[],timer=null;
const biquoteSymbol={XAUUSDT:'XAUUSD',BTCUSDT:'BTCUSD',ETHUSDT:'ETHUSD',EURUSDT:'EURUSD',USDJPY:'USDJPY',GBPUSDT:'GBPUSD',SOLUSDT:'SOLUSD'};
function marketInfo(s){if(biquoteSymbol[s])return {source:'biquote',symbol:biquoteSymbol[s],label:'BIQUOTE'};return null;}
async function loadAccounts(){try{const r=await fetch('/api/v1/accounts/mine',{credentials:'include'});if(!r.ok)throw 0;accounts=await r.json();if(!Array.isArray(accounts))accounts=accounts.accounts||[];selected=accounts.find(a=>a.id===localStorage.getItem('aura_selected_account'))||accounts.find(a=>a.status!=='breached')||accounts[0];renderAccounts()}catch(e){document.getElementById('selectedAccount').textContent='No account loaded';}}
function renderAccounts(){const list=document.getElementById('accountList');list.innerHTML=accounts.map(a=>'<div class="account-item '+(selected&&a.id===selected.id?'selected':'')+'" data-id="'+a.id+'">'+(a.account_id||a.id)+' · '+(a.status||'active').toUpperCase()+'</div>').join('');document.getElementById('selectedAccount').textContent=selected?(selected.account_id||selected.id):'No funded account';list.querySelectorAll('.account-item').forEach(x=>x.onclick=()=>{selected=accounts.find(a=>String(a.id)===x.dataset.id);if(selected)localStorage.setItem('aura_selected_account',selected.id);renderAccounts();document.getElementById('accountList').classList.remove('open')})}
document.getElementById('accountBtn').onclick=()=>document.getElementById('accountList').classList.toggle('open');
async function fetchBiquoteDirect(symbol,interval){const url='https://biquote.io/api/'+encodeURIComponent(symbol)+'/ohlc?interval='+encodeURIComponent(interval)+'&limit=1000';const r=await fetch(url);if(!r.ok)throw new Error('Biquote HTTP '+r.status);const d=await r.json();return (Array.isArray(d.bars)?d.bars:[]).map(c=>({time:Math.floor(Date.parse(c.openTime)/1000),open:Number(c.open),high:Number(c.high),low:Number(c.low),close:Number(c.close)})).filter(c=>Number.isFinite(c.time)&&[c.open,c.high,c.low,c.close].every(Number.isFinite)).sort((a,b)=>a.time-b.time)}
const marketCache=new Map();
async function fetchMarketCandles(info,interval){const key=info.symbol+'|'+interval;const cached=marketCache.get(key);if(cached&&cached.length){candles.setData(cached);chart.timeScale().fitContent();document.getElementById('dataStatus').textContent='LIVE · '+info.label}
if(info.source==='biquote'){try{const data=await fetchBiquoteDirect(info.symbol,interval);if(data.length){marketCache.set(key,data);try{sessionStorage.setItem('aura_market_'+key,JSON.stringify(data))}catch{}return data}}catch{}}
const r=await fetch('/api/v1/market/klines?source='+info.source+'&symbol='+encodeURIComponent(info.symbol)+'&interval='+interval,{credentials:'include'});const d=await r.json();if(r.ok&&d.ok&&Array.isArray(d.candles)&&d.candles.length){marketCache.set(key,d.candles);return d.candles}throw new Error(d.detail||d.error||'Market data unavailable')}
async function fetchCandles(){const uiSymbol=document.getElementById('symbol').value, interval=document.getElementById('interval').value;const msg=document.getElementById('chartMsg');const info=marketInfo(uiSymbol);if(!info){msg.innerHTML='<span class="unsupported">Market feed unavailable.</span>';candles.setData([]);document.getElementById('dataStatus').textContent='Provider required';return}
const key='aura_market_'+info.symbol+'|'+interval;
try{try{const saved=sessionStorage.getItem(key);if(saved){const quick=JSON.parse(saved);if(Array.isArray(quick)&&quick.length){candles.setData(quick);chart.timeScale().fitContent();document.getElementById('dataStatus').textContent='LIVE · '+info.label}}}catch{}
const data=await fetchMarketCandles(info,interval);candles.setData(data);chart.timeScale().fitContent();document.getElementById('dataStatus').textContent='LIVE · '+info.label;msg.textContent='';if(timer)clearInterval(timer);timer=setInterval(updateLive,5000)}catch(e){if(!candles.data||!candles.data().length){document.getElementById('dataStatus').textContent='Market data error';msg.textContent=e.message||'Unable to load live data';}}}
function intervalSeconds(v){return ({'1m':60,'5m':300,'15m':900,'30m':1800,'1h':3600,'4h':14400,'1d':86400})[v]||300}
function updateCountdown(){const sec=intervalSeconds(document.getElementById('interval').value);const now=Math.floor(Date.now()/1000);const remain=sec-(now%sec);const m=String(Math.floor(remain/60)).padStart(2,'0');const s=String(remain%60).padStart(2,'0');document.getElementById('candleCountdown').textContent=m+':'+s}
setInterval(updateCountdown,1000);updateCountdown();
async function updateLive(){const info=marketInfo(document.getElementById('symbol').value);if(!info)return;try{const i=document.getElementById('interval').value;const r=await fetch('https://biquote.io/api/'+encodeURIComponent(info.symbol)+'/ohlc?interval='+encodeURIComponent(i)+'&limit=2');const d=await r.json();const c=(Array.isArray(d.bars)?d.bars:[])[0];if(c){candles.update({time:Math.floor(Date.parse(c.openTime)/1000),open:Number(c.open),high:Number(c.high),low:Number(c.low),close:Number(c.close)})}}catch{}}
document.getElementById('symbol').onchange=fetchCandles;document.getElementById('interval').onchange=fetchCandles;
document.getElementById('lot').value='0.10';
document.getElementById('buy').onclick=()=>alert('BUY selected — server-side order execution will be connected next.');document.getElementById('sell').onclick=()=>alert('SELL selected — server-side order execution will be connected next.');
function fitChart(){const w=chartEl.clientWidth,h=chartEl.clientHeight;if(w>0&&h>0)chart.applyOptions({width:w,height:h})}
new ResizeObserver(fitChart).observe(chartEl);window.addEventListener('resize',fitChart);
loadAccounts();fetchCandles();
</script></body></html>
