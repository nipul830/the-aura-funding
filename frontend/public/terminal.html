<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terminal · THE AURA FUNDING</title>
<link rel="stylesheet" href="/style.css">
<style>
:root{--gold:#d9ad55;--bg:#08090b;--panel:#101216;--line:#252831;--muted:#8d929d}
body{background:var(--bg);color:#f5f6f8}.terminal-shell{min-height:100vh;display:flex;flex-direction:column}.terminal-top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 14px;background:#0b0c0f}.terminal-brand{font-weight:800;letter-spacing:.08em}.terminal-brand span{color:var(--gold)}.account-box{margin-left:auto;position:relative}.account-btn{background:#111319;border:1px solid #6b5427;color:#f1c66d;border-radius:8px;padding:9px 12px;min-width:180px;text-align:left}.account-list{display:none;position:absolute;right:0;top:44px;background:#101216;border:1px solid #3b3426;border-radius:10px;min-width:240px;z-index:30;overflow:hidden}.account-list.open{display:block}.account-item{padding:11px 13px;border-bottom:1px solid #22252c;cursor:pointer}.account-item:hover,.account-item.selected{background:#211b10;color:#f1c66d}.terminal-main{position:relative;display:block;padding:0;flex:1;min-height:0}.chart-panel{position:relative;height:calc(100vh - 58px);background:var(--panel);border:0;border-radius:0;overflow:hidden}.chart-head{height:52px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);position:relative;z-index:4}.chart-head select{min-width:130px}select,input{background:#0b0d11;color:#f5f6f8;border:1px solid #30343d;border-radius:7px;padding:9px}.chart-wrap{height:calc(100vh - 110px);min-height:0}.chart-status{margin-left:auto;font-size:12px;color:var(--muted)}.order-panel{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:10;width:min(430px,calc(100% - 28px));box-sizing:border-box;padding:10px 12px;background:rgba(16,18,22,.96);border:1px solid #343841;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.35)}.order-panel h3{display:none}.order-panel .field:first-of-type{display:none}.order-panel .field{margin:0}.order-panel .field label{display:block;color:var(--muted);font-size:11px;margin:0 0 5px;text-align:center}.lot-row{display:flex;gap:6px}.lot-row button{flex:0 0 42px;background:#181b21;color:#ddd;border:1px solid #30343d;border-radius:6px}.lot-row input{flex:1;text-align:center}.trade-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.trade-btns button{padding:10px;border:0;border-radius:7px;font-weight:800}.buy{background:#16855a;color:#fff}.sell{background:#b84045;color:#fff}.note{display:none}.trade-nav{display:none}.unsupported{color:#e4b45c;font-size:12px}.loading{color:var(--muted);padding:15px}@media(max-width:800px){.chart-panel{height:calc(100vh - 58px)}.chart-wrap{height:calc(100vh - 110px);min-height:0}.order-panel{top:62px;width:min(380px,calc(100% - 24px));padding:8px 10px}.trade-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:60px;background:#0c0e12;border-top:1px solid var(--line);z-index:50}.trade-nav a{flex:1;text-align:center;padding:12px 4px;color:#8d929d;text-decoration:none;font-size:12px}.trade-nav a.active{color:var(--gold)}.terminal-brand{font-size:12px}.account-btn{min-width:145px}.chart-head{padding:0 8px}.chart-head select{min-width:0;flex:0 1 auto}.chart-status{max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
</style></head>
<body>
<div class="terminal-shell">
<header class="terminal-top"><div class="terminal-brand">THE AURA <span>FUNDING</span></div><div id="dataStatus" class="chart-status">Connecting market data…</div>
<div class="account-box"><button id="accountBtn" class="account-btn">ACCOUNT SWITCH ▾</button><div id="accountList" class="account-list"></div></div></header>
<main class="terminal-main">
<section class="chart-panel"><div class="chart-head"><select id="symbol"><option value="XAUUSDT">GOLD</option><option value="BTCUSDT">BTC</option><option value="ETHUSDT">ETH</option><option value="EURUSDT">EUR</option><option value="USDJPY">USDJPY</option><option value="GBPUSDT">GBPUSD</option><option value="SOLUSDT">SOLUSDT</option></select><select id="interval"><option value="1m">1m</option><option value="5m" selected>5m</option><option value="15m">15m</option><option value="1h">1h</option><option value="4h">4h</option><option value="1d">1D</option></select><div id="chartMsg" class="chart-status"></div></div><div id="chart" class="chart-wrap"></div></section>
<aside class="order-panel"><div class="field"><label>LOT SIZE</label><div class="lot-row"><button data-lot="-0.01">−</button><input id="lot" value="0.10" inputmode="decimal"><button data-lot="0.01">+</button></div></div><div class="trade-btns"><button class="sell" id="sell">SELL</button><button class="buy" id="buy">BUY</button></div></aside>
</main>
<nav class="trade-nav"><a href="/user">Dashboard</a><a class="active" href="/user/terminal">Terminal</a><a href="/user/position">Position</a></nav>
</div>
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<script>
const chartEl=document.getElementById('chart');
const chart=LightweightCharts.createChart(chartEl,{layout:{background:{color:'#101216'},textColor:'#c7cbd3'},grid:{vertLines:{color:'#171a20'},horzLines:{color:'#171a20'}},rightPriceScale:{borderColor:'#292d35'},timeScale:{borderColor:'#292d35',timeVisible:true,secondsVisible:false}});
const candles=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#20a66b',downColor:'#d95359',borderUpColor:'#20a66b',borderDownColor:'#d95359',wickUpColor:'#20a66b',wickDownColor:'#d95359'});
let selected=null,accounts=[],timer=null;
const biquoteSymbol={XAUUSDT:'XAUUSD',BTCUSDT:'BTCUSD',ETHUSDT:'ETHUSD',EURUSDT:'EURUSD',USDJPY:'USDJPY',GBPUSDT:'GBPUSD',SOLUSDT:'SOLUSD'};
function marketInfo(s){if(biquoteSymbol[s])return {source:'biquote',symbol:biquoteSymbol[s],label:'BIQUOTE'};return null;}
async function loadAccounts(){try{const r=await fetch('/api/v1/accounts/mine',{credentials:'include'});if(!r.ok)throw 0;accounts=await r.json();if(!Array.isArray(accounts))accounts=accounts.accounts||[];selected=accounts.find(a=>a.id===localStorage.getItem('aura_selected_account'))||accounts.find(a=>a.status!=='breached')||accounts[0];renderAccounts()}catch(e){document.getElementById('selectedAccount').textContent='No account loaded';}}
function renderAccounts(){const list=document.getElementById('accountList');list.innerHTML=accounts.map(a=>'<div class="account-item '+(selected&&a.id===selected.id?'selected':'')+'" data-id="'+a.id+'">'+(a.account_id||a.id)+' · '+(a.status||'active').toUpperCase()+'</div>').join('');document.getElementById('selectedAccount').textContent=selected?(selected.account_id||selected.id):'No funded account';list.querySelectorAll('.account-item').forEach(x=>x.onclick=()=>{selected=accounts.find(a=>String(a.id)===x.dataset.id);if(selected)localStorage.setItem('aura_selected_account',selected.id);renderAccounts();document.getElementById('accountList').classList.remove('open')})}
document.getElementById('accountBtn').onclick=()=>document.getElementById('accountList').classList.toggle('open');
async function fetchBiquoteDirect(symbol,interval){const url='https://biquote.io/api/'+encodeURIComponent(symbol)+'/ohlc?interval='+encodeURIComponent(interval)+'&limit=1000';const r=await fetch(url);if(!r.ok)throw new Error('Biquote HTTP '+r.status);const d=await r.json();return (Array.isArray(d.bars)?d.bars:[]).map(c=>({time:Math.floor(Date.parse(c.openTime)/1000),open:Number(c.open),high:Number(c.high),low:Number(c.low),close:Number(c.close)})).filter(c=>Number.isFinite(c.time)&&[c.open,c.high,c.low,c.close].every(Number.isFinite)).sort((a,b)=>a.time-b.time)}
async function fetchMarketCandles(info,interval){try{const r=await fetch('/api/v1/market/klines?source='+info.source+'&symbol='+encodeURIComponent(info.symbol)+'&interval='+interval,{credentials:'include'});const d=await r.json();if(r.ok&&d.ok&&Array.isArray(d.candles)&&d.candles.length)return d.candles;throw new Error(d.detail||d.error||'Backend market feed unavailable')}catch{if(info.source!=='biquote')throw new Error('Market feed unavailable');return await fetchBiquoteDirect(info.symbol,interval)}}
async function fetchCandles(){const uiSymbol=document.getElementById('symbol').value, interval=document.getElementById('interval').value;const msg=document.getElementById('chartMsg');const info=marketInfo(uiSymbol);if(!info){msg.innerHTML='<span class="unsupported">Market feed unavailable.</span>';candles.setData([]);document.getElementById('dataStatus').textContent='Provider required';return}
try{const data=await fetchMarketCandles(info,interval);candles.setData(data);chart.timeScale().fitContent();document.getElementById('dataStatus').textContent='LIVE · '+info.label;msg.textContent='';if(timer)clearInterval(timer);timer=setInterval(updateLive,5000)}catch(e){document.getElementById('dataStatus').textContent='Market data error';msg.textContent=e.message||'Unable to load live data';}}
async function updateLive(){const info=marketInfo(document.getElementById('symbol').value);if(!info)return;try{const i=document.getElementById('interval').value;const r=await fetch('https://biquote.io/api/'+encodeURIComponent(info.symbol)+'/ohlc?interval='+encodeURIComponent(i)+'&limit=2');const d=await r.json();const c=(Array.isArray(d.bars)?d.bars:[])[0];if(c){candles.update({time:Math.floor(Date.parse(c.openTime)/1000),open:Number(c.open),high:Number(c.high),low:Number(c.low),close:Number(c.close)})}}catch{}}
document.getElementById('symbol').onchange=fetchCandles;document.getElementById('interval').onchange=fetchCandles;
document.querySelectorAll('[data-lot]').forEach(b=>b.onclick=()=>{let v=Math.max(.01,Math.min(100,(+document.getElementById('lot').value||.1)+(+b.dataset.lot)));document.getElementById('lot').value=v.toFixed(2)});
document.getElementById('buy').onclick=()=>alert('BUY selected — server-side order execution will be connected next.');document.getElementById('sell').onclick=()=>alert('SELL selected — server-side order execution will be connected next.');
new ResizeObserver(()=>chart.applyOptions({width:chartEl.clientWidth,height:chartEl.clientHeight})).observe(chartEl);
loadAccounts();fetchCandles();
</script></body></html>
