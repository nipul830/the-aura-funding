<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · THE AURA FUNDING</title><link rel="stylesheet" href="/style.css"><style>.acct{border:1px solid var(--line);border-radius:18px;padding:18px;background:#0b1018;margin-bottom:16px}.acct-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.battery{height:12px;border:2px solid #344254;border-radius:8px;padding:2px;margin:12px 0}.battery span{display:block;height:100%;border-radius:4px;background:#27d17f;width:100%}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.bar{height:10px;background:#171d27;border-radius:10px;overflow:hidden;margin-top:7px}.bar span{display:block;height:100%;background:#f5b72c;width:0}.progress{margin-top:14px}.empty{padding:24px;border:1px dashed #344254;border-radius:16px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.acct-head{align-items:flex-start;flex-direction:column}}</style></head><body><div class="app"><aside class="side"><div class="brand">THE AURA <span>FUNDING</span></div><nav class="nav"><a href="/">Home</a><a class="active" href="/user">Dashboard</a><a href="/user/plans">Plans</a><a href="/user/terminal">Terminal</a><a href="/user/settings">Settings</a></nav></aside><main class="main"><div class="top"><div class="title"><h1>Dashboard</h1><div class="muted">Your funded trading accounts</div></div><a class="profile-chip" id="profile" href="/user/profile"><span class="avatar">A</span><span>Account</span></a></div><div id="accounts"><div class="empty">Loading accounts…</div></div></main></div><script>
const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));function pctAmount(v,initial){return Number(initial)*Number(v||0)/100}function render(a){const r=a.rules||{},init=Number(a.initial_balance),balance=Number(a.balance),equity=Number(a.equity),profit=balance-init,totalTarget=pctAmount(r.profitTarget?.target,init),dailyLimit=pctAmount(r.dailyDrawdown?.limit,init),maxLimit=pctAmount(r.maxDrawdown?.limit,init),floatingLimit=pctAmount(r.floatingLoss?.limit,init),days=Number(r.minTradingDays?.limit||0);const health=Math.max(0,Math.min(100,100-(Math.max(0,init-equity)/init*100)));return '<article class="acct"><div class="acct-head"><div><h2>'+esc(a.plan_name)+'</h2><div class="muted">Account Type · $'+init.toLocaleString()+'</div></div><div class="pill">'+esc(a.status.toUpperCase())+'</div></div><div class="battery"><span style="width:'+health+'%"></span></div><div class="stats"><div><div class="muted">Equity</div><strong>$'+equity.toFixed(2)+'</strong></div><div><div class="muted">P&L</div><strong>$'+profit.toFixed(2)+'</strong></div><div><div class="muted">Total Profit</div><strong>$'+profit.toFixed(2)+'</strong></div><div><div class="muted">Account Size</div><strong>$'+init.toLocaleString()+'</strong></div></div><div class="progress"><div class="muted">Profit Target · $'+totalTarget.toFixed(2)+'</div><div class="bar"><span style="width:'+Math.min(100,Math.max(0,profit/Math.max(1,totalTarget)*100))+'%"></span></div></div><div class="progress"><div class="muted">Daily Drawdown Limit · $'+dailyLimit.toFixed(2)+'</div><div class="bar"><span style="width:'+Math.min(100,Math.max(0,(init-equity)/Math.max(1,dailyLimit)*100))+'%"></span></div></div><div class="progress"><div class="muted">Maximum Drawdown · $'+maxLimit.toFixed(2)+'</div><div class="bar"><span style="width:'+Math.min(100,Math.max(0,(init-equity)/Math.max(1,maxLimit)*100))+'%"></span></div></div><div class="progress"><div class="muted">Floating Loss Limit · $'+floatingLimit.toFixed(2)+'</div><div class="bar"><span style="width:0%"></span></div></div><div class="progress"><div class="muted">Minimum Trading Days · '+days+' days</div><div class="bar"><span style="width:0%"></span></div></div></article>'}async function load(){const [ar,ur]=await Promise.all([fetch("/api/v1/accounts/mine"),fetch("/api/v1/auth/me")]);const a=await ar.json(),u=await ur.json();if(u.user){const n=u.user.fullName||u.user.email||"Account";document.getElementById("profile").innerHTML='<span class="avatar">'+esc(n.charAt(0).toUpperCase())+'</span><span>'+esc(n)+'</span>'}document.getElementById("accounts").innerHTML=a.accounts?.length?a.accounts.map(render).join(""):'<div class="empty"><h2>No funded account yet</h2><div class="muted">Choose a challenge plan, complete checkout and wait for approval.</div><a class="btn primary" href="/user/plans" style="display:inline-block;margin-top:14px">Choose Plan</a></div>'}load();</script></body></html>
