   <div class="rule"><div class="rule-row"><div class="rule-icon">${icon("target")}</div><div class="rule-name">Profit Target <span class="rule-badge">${esc(r.profitTarget?.target||0)}%</span></div><div class="rule-limit">${money(target)}<span class="rule-percent">${Math.round(pct(profit,target))}%</span></div></div><div class="track"><div class="track-fill" style="width:${pct(profit,target)}%"></div></div><div class="rule-sub">${money(Math.max(0,profit))} / ${money(target)}</div></div>
   <div class="rule"><div class="rule-row"><div class="rule-icon">${icon("down")}</div><div class="rule-name">Daily Drawdown Limit <span class="rule-badge">${esc(r.dailyDrawdown?.limit||0)}%</span></div><div class="rule-limit">${money(daily)}<span class="rule-percent">${Math.round(pct(dd,daily))}%</span></div></div><div class="track"><div class="track-fill" style="width:${pct(dd,daily)}%"></div></div><div class="rule-sub">${money(dd)} / ${money(daily)}</div></div>
   <div class="rule"><div class="rule-row"><div class="rule-icon">${icon("down")}</div><div class="rule-name">Maximum Drawdown Limit <span class="rule-badge">${esc(r.maxDrawdown?.limit||0)}%</span></div><div class="rule-limit">${money(max)}<span class="rule-percent">${Math.round(pct(dd,max))}%</span></div></div><div class="track"><div class="track-fill" style="width:${pct(dd,max)}%"></div></div><div class="rule-sub">${money(dd)} / ${money(max)}</div></div>
   <div class="rule"><div class="rule-row"><div class="rule-icon">${icon("bolt")}</div><div class="rule-name">Floating Loss Limit <span class="rule-badge">${esc(r.floatingLoss?.limit||0)}%</span></div><div class="rule-limit">${money(floating)}<span class="rule-percent">0%</span></div></div><div class="track"><div class="track-fill" style="width:0%"></div></div><div class="rule-sub">$0.00 / ${money(floating)}</div></div>
   <div class="rule"><div class="rule-row"><div class="rule-icon">${icon("cal")}</div><div class="rule-name">Minimum Trading Days <span class="rule-badge">${days} Days</span></div><div class="rule-limit">0 / ${days} Days</div></div><div class="days-track"><div class="days-dots">${Array.from({length:Math.max(1,days)},()=>'<i></i>').join("")}</div></div></div>
  </div>
  <div class="detail-row"><div class="detail"><span>Account ID</span><b>#AUR-${esc(accountNo)}</b></div><div class="detail"><span>Current Day</span><b>0 / ${days}</b></div><div class="detail"><span>Days Left</span><b>${days} Days</b></div><div class="detail"><span>Status</span><b style="color:#20ed73">● Active</b></div></div>
 </article>`;
}
let allAccounts=[],selectedId=localStorage.getItem("aura_selected_account");
function renderSelected(){try{
 const selected=allAccounts.find(x=>x.id===selectedId)||allAccounts[0];if(!selected)return;
 selectedId=selected.id;localStorage.setItem("aura_selected_account",selected.id);
 const grid=document.getElementById("accountSwitcher");
 const ordered=[selected,...allAccounts.filter(x=>x.id!==selected.id)];
const rows=[];for(let i=0;i<ordered.length;i+=3)rows.push(ordered.slice(i,i+3));
if(rows.length>1&&rows[1].length===3)rows[1]=rows[1].slice(0,2);
grid.innerHTML=rows.map(row=>'<div class="hive-row">'+row.map(x=>`<button type="button" class="hive-account ${x.id===selected.id?"selected":""}" data-id="${esc(x.id)}"><span class="hive-inner"><span class="hive-icon">A</span><span class="hive-id">#AUR-${esc((x.id||"").replace(/-/g,"").slice(0,7).toUpperCase())}</span><span class="hive-plan">${esc(x.plan_name||"Account")}</span><span class="hive-size">$ ${Number(x.account_size||x.initial_balance||0).toLocaleString()}</span><span class="hive-status">${esc(x.status||"active")}</span></span>${x.id===selected.id?'<span class="hive-selected">✓</span>':""}</button>`).join("")+'</div>').join("");
 document.querySelectorAll(".hive-account").forEach(b=>b.onclick=()=>{selectedId=b.dataset.id;localStorage.setItem("aura_selected_account",selectedId);renderSelected()});
 document.getElementById("accounts").innerHTML=render(selected);
}catch(e){console.error("Dashboard render error",e);document.getElementById("accounts").innerHTML='<div class="empty">Unable to display your account. Please refresh.</div>'}}
async function load(){
 try{
  const [ar,ur]=await Promise.all([fetch("/api/v1/accounts/mine",{cache:"no-store"}),fetch("/api/v1/auth/me",{cache:"no-store"})]);
  const a=await ar.json(),u=await ur.json();allAccounts=a.accounts||[];
  document.getElementById("accountCount").textContent=allAccounts.length+" Account"+(allAccounts.length===1?"":"s");
  if(u.user){const n=u.user.fullName||u.user.full_name||u.user.email||"Account";const wn=document.getElementById("welcomeName");const av=document.getElementById("topAvatar");if(wn)wn.textContent=n;if(av)av.textContent=n.charAt(0).toUpperCase()}
  if(allAccounts.length){document.getElementById("accountSwitcher").style.display="grid";renderSelected()}
  else document.getElementById("accounts").innerHTML='<div class="empty"><h2>No funded account yet</h2><div class="muted">Choose a challenge plan, complete checkout and wait for approval.</div><a class="btn primary" href="/user/plans" style="display:inline-block;margin-top:14px">Choose Plan</a></div>';
 }catch(e){console.error("Dashboard load error",e);document.getElementById("accounts").innerHTML='<div class="empty">Unable to load your account. Please refresh.</div>'}
}
load();
</script></body></html>
