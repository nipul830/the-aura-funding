<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments · THE AURA FUNDING</title><link rel="stylesheet" href="/style.css"><style>.pay-admin{display:grid;gap:14px}.pay-item{border:1px solid var(--line);border-radius:16px;padding:18px;background:#0b1018}.pay-actions{display:flex;gap:8px;margin-top:12px}.pay-actions button{flex:1}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.settings-grid input{width:100%;box-sizing:border-box;padding:10px;background:#07090d;color:var(--text);border:1px solid var(--line);border-radius:10px;margin-top:5px}@media(max-width:700px){.settings-grid{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand">THE AURA <span>FUNDING</span></div><nav class="nav"><a href="/admin">Dashboard</a><a href="/admin/accounts">Accounts</a><a href="/admin/plans">Plans</a><a class="active" href="/admin/payments">Payments</a><a href="/admin/content">Content</a></nav></aside><main class="main"><header class="top"><div class="title"><h1>Payments</h1><div class="muted">Review payments and configure payment details.</div></div><button id="logout" class="btn">Logout</button></header><section class="section"><div class="card"><h2>Payment Settings</h2><div class="settings-grid"><label>UPI ID<input id="upi"></label><label>UPI QR Image URL<input id="qr"></label><label>Support Email<input id="email"></label></div><h3 style="margin-top:18px">USDT Networks</h3><div id="nets" class="settings-grid"></div><button id="saveSettings" class="btn primary" style="margin-top:14px">Save Payment Settings</button><span id="setMsg" class="muted"></span></div></section></main></div><script>
const networks=["TRC20","ERC20","BEP20","POLYGON","SOLANA","ARBITRUM","OPTIMISM","AVALANCHE","BASE","TON"],$=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));async function loadSettings(){const r=await fetch("/api/v1/admin/payment-settings"),d=await r.json(),s=d.settings||{};$("upi").value=s.upi_id||"";$("qr").value=s.upi_qr_url||"";$("email").value=s.support_email||"joker007llp@gmail.com";$("nets").innerHTML=networks.map(n=>'<label>'+n+'<input data-net="'+n+'" value="'+esc(s.usdt_addresses?.[n]||"")+'"></label>').join("")}async function saveSettings(){const a={};document.querySelectorAll("[data-net]").forEach(x=>a[x.dataset.net]=x.value.trim());const r=await fetch("/api/v1/admin/payment-settings",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({upi_id:$("upi").value.trim(),upi_qr_url:$("qr").value.trim(),support_email:$("email").value.trim(),usdt_addresses:a})});$("setMsg").textContent=r.ok?"Saved successfully.":"Save failed."}$("saveSettings").onclick=saveSettings;$("logout").onclick=async()=>{await fetch("/api/v1/auth/logout",{method:"POST"});location.href="/login"};loadSettings();
</script></body></html>
